name: 🚀 React Vite CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ============================
  # 🧪 CI PHASE (CHECK CODE)
  # ============================
  ci:
    name: 🧪 CI - Code Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get code from GitHub
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Step 3: Install dependencies (uses package.json, not npm init)
      - name: 📦 Install Dependencies
        run: npm ci

      # Step 4: Lint JS/JSX
      - name: 🔍 Run ESLint
        run: npx eslint . || true


  # ============================
  # 📦 BUILD PHASE
  # ============================
  build:
    name: 📦 Build Application
    runs-on: ubuntu-latest
    needs: ci

    steps:
      # Step 1: Get code again
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # Step 4: Build with Vite (outputs to ./dist)
      - name: 🏗️ Build Project
        run: npm run build

      # Step 5: Setup Pages (needed here for upload-pages-artifact)
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      # Step 6: Upload build as a Pages artifact
      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  # ============================
  # 🚀 CD PHASE (DEPLOY)
  # ============================
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Step 1: Deploy website
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Step 2: Show live website link
      - name: 🌐 Show Live URL
        run: |
          echo "🎉 Deployment Successful!"
          echo "🌍 Website URL: ${{ steps.deploy.outputs.page_url }}"
